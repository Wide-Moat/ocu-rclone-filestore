#
# Conventional-commits gate. Runs commitlint over every commit in the pull
# request using the ruleset in .commitlintrc.yml.

name: conventional-commits

on:
  pull_request:

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint (PR commits)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the PR range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@19.6.1 @commitlint/config-conventional@19.6.0
      - name: Lint PR commits
        run: |
          npx commitlint \
            --config .commitlintrc.yml \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose
