#
# Software composition analysis (SCA). Two scanners answer two different
# questions, and neither subsumes the other:
#
#   trivy       - which declared dependencies carry a known advisory
#   govulncheck - which known vulnerabilities are actually reachable from this
#                 code, including ones in the standard library
#
# Trivy reads go.mod, so it is blind to the toolchain: a vulnerability in the
# standard library cannot appear in a manifest scan at all. Conversely
# govulncheck reports only what a call path reaches, so an advisory against a
# module we depend on but never call does not block. Running both means a
# finding has to be both undeclared and unreachable to pass unnoticed.
#
# HIGH is included deliberately: CRITICAL-only is near-vacuous for a Go module,
# where the common vulnerable dependencies (the golang.org/x/* set, the git
# libraries, and similar) publish their advisories at HIGH, not CRITICAL. Gating
# on CRITICAL alone let a HIGH-severity dependency vulnerability pass the gate
# unblocked. Blocking on CRITICAL,HIGH restores real SCA coverage. The job name
# below is kept verbatim ("CRITICAL blocks") so the branch-protection required
# status-check context still matches; the threshold it enforces is now
# CRITICAL,HIGH.

name: sca

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trivy:
    name: trivy fs (CRITICAL blocks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run trivy filesystem scan
        # Run trivy from its official image (pinned by digest) rather than the
        # action wrapper, whose install script fetches the binary from GitHub
        # release downloads and fails intermittently under rate limiting. The
        # image is pulled from a registry, avoiding that path. The job fails on
        # any CRITICAL or HIGH finding (--exit-code 1), keeping this gate blocking.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/aquasecurity/trivy@sha256:de90a656e79b175a294abe85cb8b99670fab83ebf339cccd163e6f584846809a \
            filesystem --scanners vuln --severity CRITICAL,HIGH --exit-code 1 \
            --ignore-unfixed=false --no-progress /repo

  govulncheck:
    name: govulncheck (reachable vulns)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run govulncheck inside the pinned builder image
        # The scan runs in the same image the release binary is built from,
        # with the digest read out of the Dockerfile rather than repeated here.
        # That matters because the builder sets GOTOOLCHAIN=local: its Go patch
        # level, not the go directive and not the runner's Go, decides which
        # standard-library vulnerabilities the shipped binary carries. A scan on
        # the runner's toolchain would answer a question about the runner.
        #
        # govulncheck's version is pinned so the gate is reproducible in the
        # same sense the lint version is.
        run: |
          set -euo pipefail
          builder=$(grep -m1 '^FROM golang@sha256:' Dockerfile | awk '{print $2}')
          echo "builder image: ${builder}"
          set +e
          docker run --rm -v "${{ github.workspace }}:/src" -w /src "${builder}" \
            sh -c 'go install golang.org/x/vuln/cmd/govulncheck@v1.3.0 && exec "$(go env GOPATH)/bin/govulncheck" ./...'
          rc=$?
          set -e
          # 0 = nothing reachable, 3 = reachable vulnerabilities found. Anything
          # else is the scan failing to run, which must not read as a pass: an
          # empty result from a question that never completed looks exactly like
          # a clean one.
          case "${rc}" in
            0) echo "no reachable vulnerabilities" ;;
            3) echo "::error::govulncheck found reachable vulnerabilities"; exit 1 ;;
            *) echo "::error::govulncheck failed to run (exit ${rc}); treating as blocking"; exit 1 ;;
          esac
